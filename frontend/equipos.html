<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipos - Mundial_Fut_2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
</head>
<body>

  <nav class="top-nav-bar">
      <button class="btn-nav-back" onclick="mostrar('dashboard')">
          <i class='bx bx-chevron-left'></i> Salir al Menú
      </button>
      <div class="nav-title">GESTIÓN DE SELECCIONES</div>
  </nav>

  <!-- Dentro de tu <main> o sección principal en equipos.html -->
<section class="sec-seleccion-equipos">
    
    <!-- Encabezado estilo FIFA -->
    <div class="fifa-header" style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Elige tu Selección</h2>
        <button class="btn-fichar" style="padding: 8px 20px; font-size: 0.9rem;" onclick="abrirModalEquipo()">
            <i class='bx bx-plus-circle'></i> Nuevo Equipo
        </button>
    </div>

    <!-- Contenedor Principal Dividido -->
    <div class="split-container">
        
        <!-- PANEL IZQUIERDO: Grid de Equipos -->
        <div class="panel-izquierdo" id="teams-grid">
            <!-- Cargando equipos desde la BD... -->
        </div>

        <!-- PANEL DERECHO: Detalles del Equipo -->
        <div class="panel-derecho" id="team-details">
            <!-- Fondo del mapa (marca de agua) -->
            <div class="map-bg"></div>
            
            <div class="details-content">
                <h3 class="details-title">SELECCIÓN NACIONAL</h3>
                <p class="details-location">
                    <i class='bx bx-map'></i> <span id="lbl-nombre-equipo">SELECCIONA UN EQUIPO</span>
                </p>

                <!-- Escudo/Carta Gigante -->
                <div class="shield-wrapper" id="shield-wrapper">
                    <div class="shield-placeholder" id="escudo-placeholder">
                        <i class='bx bx-shield-alt-2'></i>
                    </div>
                </div>

                <!-- Estadísticas / Info que antes iba en el modal -->
                <div class="team-stats">
                    <p id="lbl-desc-equipo">La información del equipo que selecciones aparecerá aquí. Podrás ver su director técnico, grupo y estadísticas clave para el mundial.</p>
                    
                    <div class="stats-grid" id="stats-grid-container" style="display: none;">
                        <div class="stat-item">
                            <span class="stat-label">GRUPO</span>
                            <span class="stat-value" id="lbl-grupo">-</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">ENTRENADOR</span>
                            <span class="stat-value" id="lbl-entrenador">-</span>
                        </div>
                    </div>
                    
                    <!-- Botones de Acción (Aparecen al seleccionar) -->
                    <div id="team-actions" style="display: none; margin-top: 25px; gap: 10px;"></div>
                </div>
            </div>
        </div>

    </div>
</section>

  <!-- ===== MODAL EQUIPO ===== -->
  <div id="modal-equipo" class="fifa-modal-overlay">
      <div class="fifa-modal-content">
          <div class="modal-header">
              <h2 id="modal-equipo-titulo">NUEVO EQUIPO</h2>
              <button class="btn-close" onclick="cerrarModalEquipo()"><i class='bx bx-x'></i></button>
          </div>
          
          <div class="modal-body">
              <input type="hidden" id="eq-id">
              <input type="hidden" id="eq-idgrupo">
              
              <div class="form-group">
                  <label>País / Selección</label>
                  <input type="text" id="eq-pais" placeholder="Ej. Brasil">
              </div>
              <div class="form-group">
                  <label>Grupo Asignado</label>
                  <input type="text" id="eq-grupo" placeholder="Ej. A">
              </div>
          </div>

          <div class="modal-footer">
              <button class="btn-cancel" onclick="cerrarModalEquipo()">Cancelar</button>
              <button class="btn-confirm" onclick="guardarEquipo()">Guardar Selección</button>
          </div>
      </div>
  </div>

  <div id="toast"></div>
</body>
</html>
