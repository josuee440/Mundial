<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugadores - Mundial UMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="top-nav-bar">
        <button class="btn-nav-back" onclick="mostrar('dashboard')">
            <i class='bx bx-chevron-left'></i> Salir al Menú
        </button>
        <div class="nav-title">GESTIÓN DE PLANTILLAS</div>
    </nav>

    <main class="main-plantillas">
        <div class="tools-bar">
            <div class="search-box">
                <i class='bx bx-search'></i>
                <input id="buscar-jugador" type="text" placeholder="Buscar por nombre, dorsal o posición..." oninput="filtrarJugadores()">
            </div>
            <button class="btn-fichar" onclick="abrirModalJugador()">
                <i class='bx bx-user-plus'></i> Fichar Jugador
            </button>
        </div>

        <div id="jugadores-container" class="fut-cards-grid">
            </div>
    </main>

    <div id="modal-jugador" class="fifa-modal-overlay">
        <div class="fifa-modal-content">
            <div class="modal-header">
                <h2 id="modal-jugador-titulo">NUEVO FICHAJE</h2>
                <button class="btn-close" onclick="cerrarModalJugador()"><i class='bx bx-x'></i></button>
            </div>
            
            <div class="modal-body">
                <input type="hidden" id="jug-id">
                
                <div class="form-group">
                    <label>Nombre en la camiseta</label>
                    <input type="text" id="jug-nombre" placeholder="Ej. L. MESSI">
                </div>
                
                <div class="form-row">
                    <div class="form-group half">
                        <label>Posición</label>
                        <select id="jug-posicion">
                            <option value="POR">Portero (POR)</option>
                            <option value="DEF">Defensa (DEF)</option>
                            <option value="MED">Mediocampista (MED)</option>
                            <option value="DEL">Delantero (DEL)</option>
                        </select>
                    </div>
                    <div class="form-group half">
                        <label>Dorsal</label>
                        <input type="number" id="jug-dorsal" placeholder="10" min="1" max="99">
                    </div>
                </div>

                <div class="form-group">
                    <label>Selección Nacional (Equipo)</label>
                    <select id="jug-idequipo">
                        </select>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-cancel" onclick="cerrarModalJugador()">Cancelar</button>
                <button class="btn-confirm" onclick="guardarJugador()">Confirmar Fichaje</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
