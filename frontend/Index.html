<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundial_Fut_2026 - UMG</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/app.js" defer></script>
</head>
<body>

  <header>
    <div class="logo">Mundial Fut 2026</div>
  </header>

  <section id="sec-dashboard" class="seccion activa">
    <div class="seccion-titulo">Menú Principal</div>
    <div class="dashboard-grid">
      <div class="stat-card menu-card" onclick="mostrar('equipos')">
        <div class="num" id="cnt-equipos">—</div>
        <div class="lbl">Equipos</div>
      </div>
      <div class="stat-card menu-card" onclick="mostrar('jugadores')">
        <div class="num" id="cnt-jugadores">—</div>
        <div class="lbl">Jugadores</div>
      </div>
      <div class="stat-card menu-card" onclick="mostrar('estadios')">
        <div class="num" id="cnt-estadios">—</div>
        <div class="lbl">Estadios</div>
      </div>
      <div class="stat-card menu-card" onclick="mostrar('partidos')">
        <div class="num" id="cnt-partidos">—</div>
        <div class="lbl">Partidos Históricos</div>
      </div>
      <div class="stat-card menu-card sim-card" onclick="mostrar('simulador')">
        <div class="num">Simular</div>
        <div class="lbl">Ir al Motor de Torneo</div>
      </div>
      <div class="stat-card menu-card rep-card" onclick="mostrar('estadisticas')">
        <div class="num">Reportes</div>
        <div class="lbl">Ver Premios Finales</div>
      </div>
    </div>
  </section>

  <section id="sec-entrenadores" class="seccion">
    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
      <button class="btn btn-gris" onclick="mostrar('dashboard')">Volver</button>
      <div class="seccion-titulo" style="margin-bottom: 0;">Entrenadores</div>
    </div>
    <div class="tabla-wrap">
      <table>
        <thead>
          <tr><th>#</th><th>Nombre</th><th>País (Equipo)</th></tr>
        </thead>
        <tbody id="tb-entrenadores">
          <tr><td colspan="3" class="loading">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section id="sec-grupos" class="seccion">
    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
      <button class="btn btn-gris" onclick="mostrar('dashboard')">Volver</button>
      <div class="seccion-titulo" style="margin-bottom: 0;">Tabla de Grupos</div>
    </div>
    <div class="grupos-grid" id="grupos-container"></div>
  </section>

  <div id="modal-jugador" class="modal-overlay">
    <div class="modal-content">
      <h2 id="modal-jugador-titulo">Nuevo Jugador</h2>
      <input type="hidden" id="jug-id">
      <div class="form-group"><label>Nombre</label><input type="text" id="jug-nombre"></div>
      <div class="form-group">
        <label>Posición</label>
        <select id="jug-posicion">
          <option value="Portero">Portero</option>
          <option value="Defensa">Defensa</option>
          <option value="Mediocampista">Mediocampista</option>
          <option value="Delantero">Delantero</option>
        </select>
      </div>
      <div class="form-group"><label>Dorsal</label><input type="number" id="jug-dorsal"></div>
      <div class="form-group"><label>Equipo</label><select id="jug-idequipo"></select></div>
      <div class="modal-actions">
        <button class="btn btn-rojo" onclick="cerrarModalJugador()">Cancelar</button>
        <button class="btn btn-verde" onclick="guardarJugador()">Guardar</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

</body>
</html>
