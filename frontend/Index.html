<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundial UMG - FIFA Re-Design</title>
    <!-- Tus enlaces a fuentes y Boxicons se mantienen -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Bebas+Neue&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- El enlace a tus estilos se mantiene -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="right-main">
        <!-- SECCIÓN DASHBOARD (Rediseñada totalmente) -->
        <section class="sec-dashboard">
            <div class="hero-layer">
                <div class="hero-content">
                    <h1 class="main-title">MUNDIAL UMG 2026</h1>
                    <p class="main-desc">Simula el torneo y gestiona tu equipo</p>
                    <div class="hero-stats">
                        <span class="main-label">0 VICTORIAS</span>
                        <span class="main-label">EMPATES 0</span>
                        <span class="main-label">VICTORIAS 0</span>
                    </div>
                </div>
                <!-- Imagen de la Copa -->
                <img src="img/Copa.png" alt="Copa Mundial" class="hero-player">
                <div class="background-effect"></div>
            </div>

            <!-- Navegación inferior (Replicando las tarjetas de la imagen) -->
            <div class="bottom-navigation">
                <!-- Tarjeta 1 - Seleccionada -->
                <div class="nav-card card-selected" onclick="mostrar('equipos')">
                    <span class="card-label">EQUIPOS</span>
                    <i class='bx bx-shield card-icon'></i>
                </div>
                <!-- Tarjeta 2 -->
                <div class="nav-card" onclick="mostrar('jugadores')">
                    <span class="card-label">JUGADORES</span>
                    <i class='bx bx-user-circle card-icon'></i>
                </div>
                <!-- Tarjeta 3 -->
                <div class="nav-card" onclick="mostrar('estadios')">
                    <span class="card-label">ESTADIOS</span>
                    <i class='bx bx-buildings card-icon'></i>
                </div>
                <!-- Tarjeta 4 -->
                <div class="nav-card" onclick="mostrar('partidos')">
                    <span class="card-label">PARTIDOS</span>
                    <i class='bx bx-clipboard card-icon'></i>
                </div>
                <!-- Tarjeta 5 -->
                <div class="nav-card" onclick="mostrar('simulador')">
                    <span class="card-label">SIMULADOR</span>
                    <i class='bx bx-play-circle card-icon'></i>
                </div>
                <!-- Tarjeta 6 -->
                <div class="nav-card" onclick="mostrar('estadisticas')">
                    <span class="card-label">ESTADÍSTICAS</span>
                    <i class='bx bx-trophy card-icon'></i>
                </div>
            </div>
        </section>

        <!-- Pie de página con leyenda de controles -->
        <footer class="bottom-legend">
            <span><i class='bx bxs-circle icon-control'></i> Seleccionar</span>
            <span><i class='bx bx-circle icon-control'></i> Atrás</span>
        </footer>
    </main>

    <!-- Tus scripts se mantienen -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
