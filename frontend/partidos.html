<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partidos - Mundial UMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="top-nav-bar">
        <button class="btn-nav-back" onclick="mostrar('dashboard')">
            <i class='bx bx-chevron-left'></i> Salir al Menú
        </button>
        <div class="nav-title">CENTRO DE PARTIDOS</div>
    </nav>

    <main class="main-plantillas">
        
        <div class="phase-filters">
            <button class="phase-btn active" onclick="filtrarPorFase('', this)">Todos</button>
            <button class="phase-btn" onclick="filtrarPorFase('Grupos', this)">Fase de Grupos</button>
            <button class="phase-btn" onclick="filtrarPorFase('Dieciseisavos', this)">Dieciseisavos</button>
            <button class="phase-btn" onclick="filtrarPorFase('Octavos', this)">Octavos</button>
            <button class="phase-btn" onclick="filtrarPorFase('Cuartos', this)">Cuartos</button>
            <button class="phase-btn" onclick="filtrarPorFase('Semifinal', this)">Semifinales</button>
            <button class="phase-btn" onclick="filtrarPorFase('Final', this)">Final</button>
        </div>

        <div class="tools-bar">
            <div class="search-box">
                <i class='bx bx-search'></i>
                <input id="buscar-partido" type="text" placeholder="Buscar por equipo, grupo o fecha..." oninput="filtrarPartidos()">
            </div>
            <button class="btn-fichar" onclick="abrirModalPartido()">
                <i class='bx bx-calendar-plus'></i> Programar Partido
            </button>
        </div>

        <div id="partidos-container" class="matches-grid">
            </div>
    </main>

    <div id="modal-partido" class="fifa-modal-overlay">
        <div class="fifa-modal-content">
            <div class="modal-header">
                <h2 id="modal-partido-titulo">PROGRAMAR ENCUENTRO</h2>
                <button class="btn-close" onclick="cerrarModalPartido()"><i class='bx bx-x'></i></button>
            </div>
            
            <div class="modal-body">
                <input type="hidden" id="partido-id">
                
                <div class="form-row">
                    <div class="form-group half">
                        <label>Equipo Local</label>
                        <select id="partido-local"></select>
                    </div>
                    <div class="form-group half">
                        <label>Equipo Visitante</label>
                        <select id="partido-visitante"></select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group half">
                        <label>Fase / Grupo</label>
                        <input type="text" id="partido-fase" placeholder="Ej. Grupo A">
                    </div>
                    <div class="form-group half">
                        <label>Estadio</label>
                        <select id="partido-estadio"></select>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-cancel" onclick="cerrarModalPartido()">Cancelar</button>
                <button class="btn-confirm" onclick="guardarPartido()">Guardar Partido</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
