<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador - Mundial UMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="sim-body">

    <!-- Menú Superior Rápido -->
    <nav class="top-nav-bar">
        <button class="btn-nav-back" onclick="mostrar('dashboard')">
            <i class='bx bx-chevron-left'></i> Salir al Menú
        </button>
        <div class="nav-title">SIMULADOR DEL TORNEO</div>
    </nav>

    <main class="main-simulacion">
        
        <!-- VISTA: FASE DE GRUPOS -->
        <div id="vista-grupos-sim" style="display: block;">
            <div class="tools-bar">
                <div style="display:flex; align-items:center; gap:15px;">
                    <h2 style="font-family: var(--font-titles); font-size: 2rem; color: #FFF;">Fase de Grupos</h2>
                    <span id="estado-grupos" style="color: #A2D148; font-weight: bold;"></span>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-cancel" onclick="limpiarBD()">
                        <i class='bx bx-trash'></i> Limpiar Datos
                    </button>
                    <button class="btn-fichar" onclick="simularFaseGrupos()">
                        <i class='bx bx-play'></i> Simular Grupos
                    </button>
                    <button class="btn-fichar" id="btn-ir-llaves" style="display:none; background: #A2D148; color: #000;" onclick="irAFase('eliminacion')">
                        Ver Llaves <i class='bx bx-right-arrow-alt'></i>
                    </button>
                </div>
            </div>

            <div id="grupos-sim-container" class="stadiums-grid" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));">
                <div class="loading" style="grid-column: 1/-1; text-align: center; color: #FFF; padding: 40px; border: 1px dashed #2A3143; border-radius: 10px;">Presiona "Simular Grupos" para comenzar el torneo...</div>
            </div>
        </div>

        <!-- VISTA: FASE ELIMINATORIA (BRACKET) -->
        <div id="vista-eliminacion" style="display: none;">
            <div class="tools-bar">
                <h2 style="font-family: var(--font-titles); font-size: 2rem; color: #FFF;">
                    Fase Actual: <span id="fase-actual" style="color: var(--fifa-blue);">DIECISEISAVOS DE FINAL</span>
                </h2>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-cancel" onclick="resetTodo()">
                        <i class='bx bx-reset'></i> Reiniciar Todo
                    </button>
                    <button class="btn-fichar" onclick="simularFase()">
                        <i class='bx bx-play-circle'></i> Simular Fase
                    </button>
                </div>
            </div>

            <div id="bracket" class="bracket-container">
                <!-- Se llena con JS -->
            </div>
        </div>
    </main>

    <div id="toast"></div>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
