<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - Mundial UMG</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="sim-body">

    <!-- Menú Superior Rápido -->
    <nav class="top-nav-bar">
        <button class="btn-nav-back" onclick="mostrar('dashboard')">
            <i class='bx bx-chevron-left'></i> Salir al Menú
        </button>
        <div class="nav-title">CENTRO DE ESTADÍSTICAS</div>
    </nav>

    <main class="main-plantillas">
        
        <!-- Campeón Banner -->
        <div id="campeon-box" style="display:none; text-align: center; margin-bottom: 40px; background: linear-gradient(135deg, #16467F 0%, #0070E0 100%); padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,112,224,0.3); border: 2px solid #A2D148;">
            <h2 style="font-family: var(--font-titles); font-size: 2.5rem; color: #A2D148; margin-bottom: 15px; letter-spacing: 2px;">🏆 CAMPEÓN DEL MUNDO 🏆</h2>
            <div id="campeon-nombre" style="font-family: var(--font-titles); font-size: 5rem; color: #FFF; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; gap: 20px;"></div>
        </div>

        <div class="stats-grid-awards" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 30px;">
            <!-- Pichichi -->
            <div class="award-card" style="background: #11141A; border: 1px solid #2A3143; border-radius: 12px; padding: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);">
                <h3 style="color: #FFD700; font-family: var(--font-titles); font-size: 2rem; border-bottom: 2px solid #2A3143; padding-bottom: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;"><i class='bx bx-football'></i> BOTA DE ORO</h3>
                <div id="podio-goleadores"></div>
            </div>
            
            <!-- Mejor Portero -->
            <div class="award-card" style="background: #11141A; border: 1px solid #2A3143; border-radius: 12px; padding: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);">
                <h3 style="color: #A2D148; font-family: var(--font-titles); font-size: 2rem; border-bottom: 2px solid #2A3143; padding-bottom: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;"><i class='bx bx-shield-quarter'></i> GUANTE DE ORO</h3>
                <div id="podio-porteros"></div>
            </div>

            <!-- Tarjetas Amarillas -->
            <div class="award-card" style="background: #11141A; border: 1px solid #2A3143; border-radius: 12px; padding: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);">
                <h3 style="color: #FFD166; font-family: var(--font-titles); font-size: 2rem; border-bottom: 2px solid #2A3143; padding-bottom: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;"><i class='bx bxs-copy'></i> AMARILLAS</h3>
                <div id="podio-amarillas"></div>
            </div>

            <!-- Tarjetas Rojas -->
            <div class="award-card" style="background: #11141A; border: 1px solid #2A3143; border-radius: 12px; padding: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);">
                <h3 style="color: #EF476F; font-family: var(--font-titles); font-size: 2rem; border-bottom: 2px solid #2A3143; padding-bottom: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;"><i class='bx bxs-copy'></i> ROJAS</h3>
                <div id="podio-rojas"></div>
            </div>
        </div>

    </main>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
